<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos to Document</title>
<style>
  :root {
    --bg: #f4f6f8; --surface: #ffffff; --line: #d9e0e6; --ink: #1c2630; --muted: #647181;
    --accent: #0e5a4f; --accent-hover: #0a473e; --accent-ink: #ffffff; --danger: #a42a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161b; --surface: #1a2128; --line: #2c3842; --ink: #e7edf2; --muted: #93a2ae;
      --accent: #5fbfad; --accent-hover: #7fd0c0; --accent-ink: #06201b; --danger: #f09a8f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 64px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }

  #dropzone {
    border: 2px dashed var(--line); border-radius: 12px; background: var(--surface);
    padding: 36px 16px; text-align: center; cursor: pointer; transition: border-color .15s;
  }
  #dropzone.drag { border-color: var(--accent); }
  #dropzone p { margin: 0; color: var(--muted); }
  #dropzone strong { color: var(--ink); }
  #fileInput { display: none; }

  #list {
    list-style: none; margin: 20px 0; padding: 0; display: grid; gap: 10px;
  }
  #list li {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  #list img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  #list .name { flex: 1; min-width: 0; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list button {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px;
    border-radius: 6px;
  }
  #list button:hover { background: var(--bg); color: var(--ink); }
  #list button.remove:hover { color: var(--danger); }
  #list .handle { cursor: grab; color: var(--muted); }
  #list li.dragging { opacity: 0.4; }

  #empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.9rem; }

  .actions { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  button.primary {
    flex: 1; min-width: 160px; padding: 12px 16px; border-radius: 10px; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary {
    flex: 1; min-width: 160px; padding: 12px 16px; border-radius: 10px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 0.95rem;
    font-weight: 600; cursor: pointer;
  }
  button.secondary:hover { background: var(--bg); }
  button.secondary:disabled { opacity: 0.45; cursor: not-allowed; }

  #status { margin-top: 10px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>Photos to Document</h1>
  <p class="sub">Upload pictures, arrange them, then download one combined PDF or Word document. Everything happens in your browser — nothing is uploaded anywhere.</p>

  <div id="dropzone">
    <p><strong>Click to choose photos</strong> or drag and drop them here</p>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple>

  <ul id="list"></ul>
  <p id="empty">No photos added yet.</p>

  <div class="actions">
    <button class="primary" id="downloadPdf" disabled>Download as PDF</button>
    <button class="secondary" id="downloadDocx" disabled>Download as Word</button>
  </div>
  <div id="status"></div>
</main>

<script>/*__JSPDF__*/</script>
<script>/*__DOCX__*/</script>
<script>
(function () {
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const downloadPdfBtn = document.getElementById('downloadPdf');
  const downloadDocxBtn = document.getElementById('downloadDocx');
  const status = document.getElementById('status');

  /** @type {{id:number, file:File, url:string, width:number, height:number}[]} */
  let photos = [];
  let nextId = 1;

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  function addFiles(fileList) {
    const files = Array.from(fileList).filter((f) => f.type.startsWith('image/'));
    files.forEach((file) => {
      const id = nextId++;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        photos.push({ id, file, url, width: img.naturalWidth, height: img.naturalHeight });
        render();
      };
      img.src = url;
    });
  }

  function removePhoto(id) {
    const p = photos.find((x) => x.id === id);
    if (p) URL.revokeObjectURL(p.url);
    photos = photos.filter((x) => x.id !== id);
    render();
  }

  function movePhoto(id, direction) {
    const i = photos.findIndex((x) => x.id === id);
    const j = i + direction;
    if (i < 0 || j < 0 || j >= photos.length) return;
    [photos[i], photos[j]] = [photos[j], photos[i]];
    render();
  }

  let dragSrcId = null;

  function render() {
    list.innerHTML = '';
    empty.style.display = photos.length ? 'none' : 'block';
    downloadPdfBtn.disabled = photos.length === 0;
    downloadDocxBtn.disabled = photos.length === 0;

    photos.forEach((p) => {
      const li = document.createElement('li');
      li.draggable = true;
      li.dataset.id = p.id;

      li.addEventListener('dragstart', () => { dragSrcId = p.id; li.classList.add('dragging'); });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', (e) => e.preventDefault());
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dragSrcId === null || dragSrcId === p.id) return;
        const from = photos.findIndex((x) => x.id === dragSrcId);
        const to = photos.findIndex((x) => x.id === p.id);
        const [moved] = photos.splice(from, 1);
        photos.splice(to, 0, moved);
        dragSrcId = null;
        render();
      });

      const handle = document.createElement('span');
      handle.className = 'handle';
      handle.textContent = '⠿';
      li.appendChild(handle);

      const img = document.createElement('img');
      img.src = p.url;
      li.appendChild(img);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = p.file.name;
      li.appendChild(name);

      const up = document.createElement('button');
      up.textContent = '↑';
      up.title = 'Move up';
      up.addEventListener('click', () => movePhoto(p.id, -1));
      li.appendChild(up);

      const down = document.createElement('button');
      down.textContent = '↓';
      down.title = 'Move down';
      down.addEventListener('click', () => movePhoto(p.id, 1));
      li.appendChild(down);

      const remove = document.createElement('button');
      remove.textContent = '✕';
      remove.className = 'remove';
      remove.title = 'Remove';
      remove.addEventListener('click', () => removePhoto(p.id));
      li.appendChild(remove);

      list.appendChild(li);
    });
  }

  function setBusy(msg) {
    status.textContent = msg || '';
    downloadPdfBtn.disabled = photos.length === 0 || !!msg;
    downloadDocxBtn.disabled = photos.length === 0 || !!msg;
  }

  async function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  downloadPdfBtn.addEventListener('click', async () => {
    if (!photos.length) return;
    setBusy('Building PDF…');
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'pt' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 24;

      for (let i = 0; i < photos.length; i++) {
        const p = photos[i];
        if (i > 0) pdf.addPage();
        const maxW = pageW - margin * 2;
        const maxH = pageH - margin * 2;
        const scale = Math.min(maxW / p.width, maxH / p.height, 1) || Math.min(maxW / p.width, maxH / p.height);
        const w = p.width * scale;
        const h = p.height * scale;
        const x = (pageW - w) / 2;
        const y = (pageH - h) / 2;
        const dataUrl = await readAsDataURL(p.file);
        const format = /png/i.test(p.file.type) ? 'PNG' : 'JPEG';
        pdf.addImage(dataUrl, format, x, y, w, h, undefined, 'MEDIUM');
      }

      pdf.save('document.pdf');
      setBusy('');
    } catch (err) {
      console.error(err);
      setBusy('Could not build the PDF. See console for details.');
    }
  });

  downloadDocxBtn.addEventListener('click', async () => {
    if (!photos.length) return;
    setBusy('Building Word document…');
    try {
      const { Document, Packer, Paragraph, ImageRun, PageBreak } = window.docx;
      const maxWidthPt = 468; // ~6.5in usable width at 72pt margins on US Letter
      const maxHeightPt = 648;

      const children = [];
      for (let i = 0; i < photos.length; i++) {
        const p = photos[i];
        const buffer = await p.file.arrayBuffer();
        const scale = Math.min(maxWidthPt / p.width, maxHeightPt / p.height, 1) || Math.min(maxWidthPt / p.width, maxHeightPt / p.height);
        const w = Math.round(p.width * scale);
        const h = Math.round(p.height * scale);

        children.push(new Paragraph({
          children: [new ImageRun({ data: buffer, transformation: { width: w, height: h } })],
        }));
        if (i < photos.length - 1) {
          children.push(new Paragraph({ children: [new PageBreak()] }));
        }
      }

      const doc = new Document({ sections: [{ children }] });
      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.docx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setBusy('');
    } catch (err) {
      console.error(err);
      setBusy('Could not build the Word document. See console for details.');
    }
  });

  render();
})();
</script>
</body>
</html>
